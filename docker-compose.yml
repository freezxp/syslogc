# Syslogc single-node stack.
#
#   docker compose up -d
#   docker compose logs syslogc | grep -A3 "initial administrator"   # first login
#   logger --server 127.0.0.1 --udp --port 514 "Test syslog message"
#   open http://<host>:8080
#
# Retention: set SYSLOGC_RETENTION (e.g. in .env) — it configures both
# VictoriaLogs and Syslogc so they stay in sync.
name: syslogc

x-syslogc-image: &syslogc-image
  image: ghcr.io/freezxp/syslogc:${SYSLOGC_VERSION:-dev}
  build:
    context: .
    target: syslogc
    args:
      VERSION: ${SYSLOGC_VERSION:-dev}

services:
  syslogc:
    <<: *syslogc-image
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      victorialogs:
        condition: service_started
      victoriametrics:
        condition: service_started
    ports:
      # The UI and API require login. Put a TLS reverse proxy in front before
      # exposing this beyond a trusted network, then set
      # SYSLOGC_AUTH_COOKIE_SECURE=true. Restrict with SYSLOGC_HTTP_BIND=127.0.0.1.
      - "${SYSLOGC_HTTP_BIND:-0.0.0.0}:${SYSLOGC_HTTP_PORT:-8080}:8080"
      - "514:5514/udp"
      - "514:5514/tcp"
      # - "6514:6514/tcp"   # enable together with the syslog-tls source
    environment:
      # Stable across container re-creation (ingestion-rate history is per node).
      SYSLOGC_NODE_ID: ${SYSLOGC_NODE_ID:-syslogc-1}
      SYSLOGC_RETENTION_PERIOD: ${SYSLOGC_RETENTION:-30d}
      SYSLOGC_AUTH_COOKIE_SECURE: ${SYSLOGC_AUTH_COOKIE_SECURE:-false}
      # Public URL(s) of a reverse proxy, comma-separated, e.g. https://logs.example.com
      SYSLOGC_SERVER_HTTP_ALLOWED_ORIGINS: ${SYSLOGC_ALLOWED_ORIGINS:-}
      # Proxy addresses allowed to set X-Forwarded-For, comma-separated IPs/CIDRs
      SYSLOGC_SERVER_HTTP_TRUSTED_PROXIES: ${SYSLOGC_TRUSTED_PROXIES:-}
      # Where rolled-up measurements are stored; empty disables the rollups.
      SYSLOGC_ANALYTICS_METRICS_URL: ${SYSLOGC_METRICS_URL-http://victoriametrics:8428}
    volumes:
      # Settings of your own belong in a copy that upgrades do not touch:
      #   cp deploy/compose/syslogc.yaml deploy/compose/syslogc.local.yaml
      # and set SYSLOGC_CONFIG in .env. *.local.yaml is not tracked, so
      # ./deploy.sh --upgrade keeps working.
      - ${SYSLOGC_CONFIG:-./deploy/compose/syslogc.yaml}:/etc/syslogc/syslogc.yaml:ro
      - secrets:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 45s

  # Generates the database password, DSN and signing key once (never overwrites).
  init:
    <<: *syslogc-image
    user: "0:0"
    command: ["init-secrets", "--dir", "/secrets", "--db-host", "postgres:5432", "--owner", "65532:65532"]
    volumes:
      - secrets:/secrets
    healthcheck:
      disable: true
    restart: "no"

  postgres:
    image: postgres:17.6-trixie
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: syslogc
      POSTGRES_DB: syslogc
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "syslogc", "-d", "syslogc"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128m

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -httpListenAddr=:9428
      - -retentionPeriod=${SYSLOGC_RETENTION:-30d}
      - -retention.maxDiskUsagePercent=85
      - -search.maxQueryDuration=120s
    volumes:
      - vlogs-data:/vlogs
    # Internal only. For debugging, publish on localhost:
    # ports: ["127.0.0.1:9428:9428"]
    # The image is distroless (no shell), so no container healthcheck is
    # defined; Syslogc retries writes and reports storage in /ready.

  # Derived measurements rolled up from the logs — how many distinct clients
  # queried a service in a window, and similar counts that are expensive to
  # recompute and should outlive log retention. Tiny compared to the logs,
  # so it keeps its own, much longer retention.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.108.1
    restart: unless-stopped
    command:
      - -storageDataPath=/vmdata
      - -httpListenAddr=:8428
      - -retentionPeriod=${SYSLOGC_METRICS_RETENTION:-24}
    volumes:
      - vmetrics-data:/vmdata
    # Internal only. For debugging, publish on localhost:
    # ports: ["127.0.0.1:8428:8428"]

volumes:
  vlogs-data: {}
  vmetrics-data: {}
  postgres-data: {}
  secrets: {}
