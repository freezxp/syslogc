# Syslogc configuration for the Docker Compose stack.
# Every scalar key can be overridden with SYSLOGC_* environment variables
# (see docs/configuration.md). Run `syslogc config print` to see all keys.

node:
  roles: [all]

server:
  http:
    address: ":8080"

log:
  level: info
  format: json

storage:
  type: victorialogs
  victorialogs:
    insert_url: http://victorialogs:9428
    select_url: http://victorialogs:9428
    stream_fields: [source, hostname, app_name]
    compression: none
    # How long one query may run. It is sent to VictoriaLogs, which stops the
    # query itself and says so — a far better failure than a dropped
    # connection. A caller that asks for longer, as the trend rollup does for
    # an expensive window, gets what it asked for.
    query_timeout: 60s

ingestion:
  queue:
    max_messages: 500000
    max_bytes: 256MiB
  batch:
    max_rows: 10000
    max_bytes: 8MiB
    max_wait: 500ms
  writers: 4
  sources:
    - name: syslog-udp
      type: syslog
      protocol: udp
      address: ":5514"          # published as host port 514/udp
      format: auto
      timezone: UTC
      # Turn dnsdist query logs into fields so the client address and the
      # queried name can be filtered and aggregated. Messages that do not
      # contain "dnsdist" are not matched against the pattern at all.
      extract:
        - name: dnsdist-query
          contains: dnsdist
          prefix: "dns."
          regex: '^(?P<query_time>\S+) dnsdist (?P<event>\S+) \S+ (?P<client_ip>\S+) (?P<client_port>\d+) (?P<address_family>\S+) (?P<transport>\S+) (?P<query_bytes>\S+) (?P<qname>\S+) (?P<qtype>\S+) (?P<policy>\S+)$'
      udp:
        # The kernel caps this at net.core.rmem_max (208 KiB by default);
        # raise that sysctl to give bursts somewhere to land.
        read_buffer_bytes: 32MiB

    - name: syslog-tcp
      type: syslog
      protocol: tcp
      address: ":5514"          # published as host port 514/tcp
      format: auto
      framing: auto
      max_connections: 2000

    - name: http-json
      type: http_json           # POST /api/v1/ingest with an API key

    - name: syslog-tls
      type: syslog
      protocol: tls
      address: ":6514"
      enabled: false            # provide certificates, then enable
      tls:
        cert_file: /etc/syslogc/tls/server.crt
        key_file: /etc/syslogc/tls/server.key

# Measurements derived from the logs. They outlive log retention, so a trend
# stays readable after the logs behind it are gone. See
# docs/operations.md#service-trends.
analytics:
  service_trends:
    enabled: true
    interval: 5m                # the finest window; hourly and daily follow
    backfill: 7d                # history to fill in on first start
    domain_field: dns.qname     # produced by the dnsdist extract preset
    client_field: dns.client_ip
    query_timeout: 2m           # room for one window; see storage.query_timeout
    # A busy deployment should name the source carrying DNS, so the rollup
    # stops reading everything else:
    # sources: [syslog-tcp]

retention:
  period: 30d                   # keep equal to VictoriaLogs -retentionPeriod

metadata:
  postgres:
    dsn_file: /secrets/postgres_dsn

auth:
  secret_key_file: /secrets/secret_key
  cookie_secure: false          # compose default is plain HTTP; see docker-compose.yml
  bootstrap_admin:
    username: admin             # generated password is printed once in the logs
