# Prometheus alerting rules for Syslogc.
#
# Load with: rule_files: [/etc/prometheus/alerts.yml]
# Thresholds assume one scrape per 15 s; tune the "for" clauses to your
# on-call tolerance rather than the thresholds themselves.
groups:
  - name: syslogc-ingestion
    rules:
      - alert: SyslogcDown
        expr: up{job="syslogc"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Syslogc node {{ $labels.instance }} is not scrapeable
          description: No metrics for two minutes. Logs sent to this node may be lost.

      - alert: SyslogcStorageWritesFailing
        expr: syslogc_storage_healthy == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Storage writes are failing on {{ $labels.instance }}
          description: The last storage write failed. Syslogc retries and buffers, but the queue will fill.

      - alert: SyslogcLogsDropped
        expr: sum by (instance, source, reason) (rate(syslogc_ingest_messages_dropped_total[5m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Logs dropped on {{ $labels.instance }} ({{ $labels.source }}, {{ $labels.reason }})
          description: >-
            Dropping {{ printf "%.1f" $value }} logs/s. reason="queue_full" means ingestion
            outruns storage; "denied" means a sender is not in allowed_cidrs.

      - alert: SyslogcQueueFilling
        expr: >-
          syslogc_ingest_queue_messages / syslogc_ingest_queue_capacity_messages > 0.8
          or syslogc_ingest_queue_bytes / syslogc_ingest_queue_capacity_bytes > 0.8
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Ingest queue over 80% full on {{ $labels.instance }}
          description: Storage cannot keep up. Drops start when the queue is full.

      - alert: SyslogcParseErrors
        expr: >-
          sum by (instance) (rate(syslogc_ingest_parse_errors_total[15m]))
          / clamp_min(sum by (instance) (rate(syslogc_ingest_messages_received_total[15m])), 1) > 0.05
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Over 5% of messages fail to parse on {{ $labels.instance }}
          description: Check the source format and timezone; unparsed messages are stored with parse_error.

      - alert: SyslogcUDPKernelDrops
        expr: sum by (instance, source) (rate(syslogc_ingest_udp_kernel_drops_total[10m])) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: The kernel is dropping UDP datagrams on {{ $labels.instance }}
          description: Raise net.core.rmem_max and the source's udp.read_buffer_bytes.

      - alert: SyslogcNoLogsReceived
        expr: sum by (instance) (rate(syslogc_ingest_messages_received_total[15m])) == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: No logs received for an hour on {{ $labels.instance }}
          description: Senders may be misconfigured, or a firewall may be blocking 514/udp and 514/tcp.

  - name: syslogc-storage
    rules:
      - alert: SyslogcStorageUnreachable
        expr: syslogc_storage_reachable == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Storage backend unreachable from {{ $labels.instance }}
          description: VictoriaLogs did not answer its health endpoint.

      - alert: SyslogcWriteErrors
        expr: sum by (instance, class) (rate(syslogc_storage_write_errors_total[10m])) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Storage write errors on {{ $labels.instance }} (class {{ $labels.class }})

      - alert: SyslogcIngestLatencyHigh
        expr: histogram_quantile(0.99, sum by (le, instance) (rate(syslogc_ingest_e2e_latency_seconds_bucket[10m]))) > 30
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Logs take over 30 s to reach storage on {{ $labels.instance }}
          description: p99 receive-to-stored latency is {{ printf "%.0f" $value }} s.

  - name: syslogc-api
    rules:
      - alert: SyslogcAPIErrors
        expr: >-
          sum by (instance) (rate(syslogc_http_requests_total{code=~"5.."}[10m]))
          / clamp_min(sum by (instance) (rate(syslogc_http_requests_total[10m])), 1) > 0.05
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Over 5% of API requests fail on {{ $labels.instance }}

  - name: syslogc-host
    rules:
      # syslogc_host_memory_limit_bytes is the cgroup limit where the
      # container has one and the machine's total otherwise, so this ratio
      # means the same thing either way: the share of what will actually run
      # out. syslogc_host_limit_source says which was measured.
      #
      # 90% for 15 minutes, not a lower threshold or a shorter window: the
      # used figure already excludes reclaimable page cache, so it does not
      # drift up with cache the way a naive reading would, and a batch of
      # large queries can hold 80% for a few minutes without anything being
      # wrong. Sustained 90% is different - the remaining headroom is smaller
      # than one ingest queue at capacity, and the next burst is what gets
      # the process OOM-killed.
      - alert: SyslogcHostMemoryHigh
        expr: >-
          syslogc_host_memory_used_bytes / clamp_min(syslogc_host_memory_limit_bytes, 1) > 0.9
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Memory over 90% on {{ $labels.instance }}
          description: >-
            {{ humanizePercentage $value }} of the memory ceiling is in use and has been
            for fifteen minutes. If syslogc_host_limit_source{resource="memory",source="cgroup"}
            is 1 this is a container limit and the process will be OOM-killed before the
            host notices; raise the limit or lower ingestion.queue.max_bytes.

      # Measured against used+available rather than the filesystem size, so
      # the reserve kept for root does not make a healthy disk read as 95%.
      # This is what df's Use% column shows.
      #
      # 85% warns and 95% pages. The gap is deliberate: VictoriaLogs needs
      # free space to merge parts, and a disk that crosses 85% while logs are
      # still arriving usually reaches 95% within hours, so the warning is
      # the one with time to act on. At 95% writes are close to failing and
      # the retention period is the only fast lever left.
      - alert: SyslogcHostDiskFilling
        expr: >-
          syslogc_host_disk_used_bytes
          / clamp_min(syslogc_host_disk_used_bytes + syslogc_host_disk_available_bytes, 1) > 0.85
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Disk {{ $labels.path }} over 85% full on {{ $labels.instance }}
          description: >-
            {{ humanizePercentage $value }} full. Logs go to the storage backend, so this
            is the filesystem Syslogc itself runs on; a full one stops logging and
            certificate writes.

      - alert: SyslogcHostDiskNearlyFull
        expr: >-
          syslogc_host_disk_used_bytes
          / clamp_min(syslogc_host_disk_used_bytes + syslogc_host_disk_available_bytes, 1) > 0.95
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Disk {{ $labels.path }} over 95% full on {{ $labels.instance }}
          description: >-
            {{ humanizePercentage $value }} full, so little more than the reserve kept for
            root is left. Shorten the retention period or add space now; see
            syslogc_host_disk_available_bytes for what a non-root writer actually has.

      # The log store's own disk, which is the one that costs data.
      #
      # The host alerts above watch the filesystem Syslogc's process runs on —
      # right for certificate writes, and on many deployments not even the same
      # disk as the logs. These watch where the logs actually are, and against
      # the ceiling that is actually in force: VictoriaLogs is started with
      # -retention.maxDiskUsagePercent and begins deleting the oldest data when
      # it reaches that share, which is below the filesystem's size.
      #
      # Measuring against the filesystem total instead would understate this by
      # the whole margin — on a default deployment, 58% of the disk is already
      # 68% of the ceiling — and a warning at 85% of the disk would fire only
      # once deletion had been running for some time.
      - alert: SyslogcLogStoreNearingItsLimit
        expr: >-
          (vl_total_disk_space_bytes - vl_free_disk_space_bytes)
          / clamp_min(vl_max_disk_space_usage_bytes, 1) > 0.85
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Log store at {{ humanizePercentage $value }} of the disk it may use
          description: >-
            VictoriaLogs deletes the oldest logs when this reaches 100%, so the retention
            period stops being the thing that decides how far back you can search. Add
            space, or shorten retention deliberately rather than letting the disk do it.

      # Not "the disk is full" — it will not fill, because the store trims
      # itself. The loss is silent: searches simply stop reaching as far back
      # as the configured retention says they should.
      - alert: SyslogcLogStoreTrimmingItself
        expr: >-
          (vl_total_disk_space_bytes - vl_free_disk_space_bytes)
          / clamp_min(vl_max_disk_space_usage_bytes, 1) > 0.98
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: Log store is deleting logs to stay within its disk limit
          description: >-
            At {{ humanizePercentage $value }} of its limit the oldest logs are being
            dropped to make room for new ones. Retention is now set by the disk, not by
            the configured period, and the gap grows with ingestion.

      # CPU pinned at its quota means messages queue rather than parse, so
      # this is an early warning for the ingest-queue alerts rather than a
      # problem in itself. 95% for 30 minutes: a node sized for its load does
      # not sit there, and anything shorter fires on legitimate backfill.
      - alert: SyslogcHostCPUSaturated
        expr: syslogc_host_cpu_usage_ratio > 0.95
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: CPU saturated on {{ $labels.instance }}
          description: >-
            Using {{ humanizePercentage $value }} of the available cores for half an hour.
            Where syslogc_host_limit_source{resource="cpu",source="cgroup"} is 1 the
            figure is against the container's CPU quota, not the machine.

  - name: syslogc-analytics
    rules:
      # Trends are counted from logs, so a rollup that stops for longer than
      # the logs are kept loses that period permanently. Two hours is a dozen
      # missed five-minute windows: long enough not to fire on one slow run,
      # far short of any sensible log retention.
      - alert: SyslogcServiceTrendsStopped
        expr: syslogc_service_trend_seconds_since_recorded > 7200
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: DNS service trends stopped recording on {{ $labels.instance }}
          description: >-
            Nothing recorded for {{ printf "%.0f" $value }} s. The counts come
            from logs, so whatever is missed is lost once those logs age out.
            See docs/troubleshooting.md#counts-stop-at-a-certain-time-and-never-resume.

      - alert: SyslogcServiceTrendWindowsFailing
        expr: increase(syslogc_service_trend_window_failures_total[1h]) > 3
        for: 10m
        labels: {severity: info}
        annotations:
          summary: Service trend windows are failing on {{ $labels.instance }}
          description: >-
            {{ printf "%.0f" $value }} windows could not be counted in the last
            hour, usually a query too large for the storage to answer.
