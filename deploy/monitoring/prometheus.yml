# Minimal Prometheus for the Compose monitoring profile.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: syslogc
    static_configs:
      - targets: [syslogc:8080]

  - job_name: victorialogs
    static_configs:
      - targets: [victorialogs:9428]
