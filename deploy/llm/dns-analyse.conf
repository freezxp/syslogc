# Settings for scripts/dns-analyse.py — copy to /etc/syslogc-llm.conf.
#
# It is read by the script and used as the systemd timer's EnvironmentFile,
# so a setting written here means the same thing however the tool is run.

# Where the Syslogc API is. The key needs logs:search and system:view only;
# create one under Settings > API Keys.
SYSLOGC_URL=http://127.0.0.1:8080
SYSLOGC_KEY_FILE=/etc/syslogc-llm.key

# Where the model runs. Ollama on this host by default; point it at another
# machine's Ollama, or anything else speaking the same API, to use a GPU
# elsewhere.
OLLAMA_URL=http://127.0.0.1:11434
OLLAMA_MODEL=qwen3:8b

# How much traffic to look at. A longer window says more about habits, a
# shorter one about what is happening now.
WINDOW=now-1h
