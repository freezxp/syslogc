name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-trixie
        env:
          POSTGRES_USER: syslogc
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: syslogc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syslogc" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: Verify modules
        working-directory: backend
        run: go mod verify && go mod tidy -diff
      - name: Unit tests
        working-directory: backend
        env:
          TEST_POSTGRES_DSN: postgres://syslogc:ci-password@127.0.0.1:5432/syslogc?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Vulnerability check
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: ubuntu-latest
    services:
      victorialogs:
        image: victoriametrics/victoria-logs:v1.52.0
        ports:
          - 9428:9428
      postgres:
        image: postgres:17.6-trixie
        env:
          POSTGRES_USER: syslogc
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: syslogc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syslogc" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: Wait for VictoriaLogs
        run: for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9428/health && exit 0; sleep 1; done; exit 1
      - name: Integration tests
        working-directory: backend
        env:
          TEST_VICTORIALOGS_URL: http://127.0.0.1:9428
          TEST_POSTGRES_DSN: postgres://syslogc:ci-password@127.0.0.1:5432/syslogc?sslmode=disable
        run: go test -tags integration -race -count=1 -v ./tests/integration/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Start stack
        run: docker compose up -d --build
      - name: End-to-end smoke test
        run: backend/tests/e2e/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
