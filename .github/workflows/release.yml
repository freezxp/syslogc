name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push syslogc
        id: syslogc
        uses: docker/build-push-action@v6
        with:
          context: .
          target: syslogc
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build and push loggen
        id: loggen
        uses: docker/build-push-action@v6
        with:
          context: .
          target: loggen
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository }}-loggen:${{ github.ref_name }}

      # Keyless signatures: the identity is this workflow, verifiable with
      # cosign verify --certificate-identity-regexp / --certificate-oidc-issuer.
      - name: Sign images
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.syslogc.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ github.repository }}-loggen@${{ steps.loggen.outputs.digest }}"

      - name: Release
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes --verify-tag \
            --notes-start-tag "$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo '')" ||
          gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
